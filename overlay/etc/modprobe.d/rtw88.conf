# Realtek rtw88 (e.g. RTL8822CE) scans/associates unreliably on Linux with PCIe
# ASPM enabled ("failed to send h2c command"). Disable it at the driver level;
# pcie_aspm=off on the kernel cmdline handles it at the platform level (needed
# on AMD). Both module names cover different kernel versions.
options rtw88_pci disable_aspm=1
options rtw_pci disable_aspm=1
