# miner.conf - edit this, then put it where the miner can find it at boot:
#   * Ventoy stick : copy this file to the ROOT of the Ventoy data partition
#   * Rufus/Etcher : copy to the root of the small FAT/EFI partition, OR onto a
#                    partition you labelled MINERCFG
#   * write-usb.sh : done for you automatically (MINERCFG partition)
#
# Format is KEY=VALUE, one per line. '#' starts a comment. Only the keys below
# are recognised; anything else is ignored.

# --- Pool & wallet (REQUIRED) ------------------------------------------------
# host:port of your Monero pool. Use the TLS port if POOL_TLS=true.
POOL_URL=pool.supportxmr.com:443

# Your Monero (XMR) wallet address. REPLACE THIS.
WALLET=YOUR_MONERO_ADDRESS_HERE

# A name to identify this machine on the pool dashboard.
WORKER_NAME=rig01

# true = connect over TLS (recommended). Must match the port above.
POOL_TLS=true

# --- Thermal safety ----------------------------------------------------------
# Pause mining above this CPU temperature (°C); resume ~8°C below it.
MAX_TEMP_C=85

# --- Remote monitoring -------------------------------------------------------
# XMRig HTTP API port (LAN). The status page is served on this port+8 (8088).
MONITOR_PORT=8080
# Token protecting the API. CHANGE THIS to anything non-guessable.
MONITOR_TOKEN=change-me

# --- WiFi (optional) ---------------------------------------------------------
# Leave WIFI_SSID blank on wired machines. To use WiFi, set your network name
# and password; the rig joins it at boot (needs WiFi driver firmware, which is
# included in the image). WIFI_COUNTRY is the 2-letter regulatory code -- set
# it to YOUR country (e.g. PL): with US, 2.4 GHz channels 12-13 are unusable.
# Quotes around values are optional.
WIFI_SSID=
WIFI_PASS=
WIFI_COUNTRY=US

# --- Advanced (optional) -----------------------------------------------------
# Percentage of logical cores to mine with (1-100). Leave blank for 100 (all).
CPU_MAX_THREADS_HINT=
